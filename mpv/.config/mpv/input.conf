# ── Playback controls ───────────────────────────────────────
MBTN_MID     cycle pause
MBTN_RIGHT   cycle mute

# ── Seeking ─────────────────────────────────────────────────
Ctrl+LEFT    seek -10             # back 10 s
Ctrl+RIGHT   seek 10              # forward 10 s


# ── Volume & subtitles ──────────────────────────────────────
WHEEL_UP     add volume 3
WHEEL_DOWN   add volume -3
Ctrl+UP      add sub-delay 0.1
Ctrl+DOWN    add sub-delay -0.1

# ── Tracks & OSD ────────────────────────────────────────────
a            cycle audio
o            cycle osd

# ── Screenshots ─────────────────────────────────────────────
Ctrl+s       screenshot           # saves to the working directory, with subtitles

